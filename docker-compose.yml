version: "3.8"
name: e-page

services:
  app:
    build: .
    container_name: ePage
    ports:
      - "13000:3000"

    volumes:
      # 目录挂载到容器中
      - D:/html/res:/images
      - ./public:/app/public

    environment:
      - NODE_ENV=production # 生产环境

    restart: unless-stopped # 除非手动停止，否则总是重启
