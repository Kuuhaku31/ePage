name: e-page

services:
  app:
    build: .
    container_name: ePage
    ports:
      - "13000:3000"

    volumes:
      # 将 config.env 中的 IMAGES_HOST_DIR 挂载到容器的 /images
      - "${IMAGES_HOST_DIR:-D:/def/e/comic}:/images"

    environment:
      NODE_ENV: production
      IMAGE_ROOT: /images

    restart: unless-stopped # 除非手动停止，否则总是重启
