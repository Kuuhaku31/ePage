<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漫画浏览器</title>
  <link rel="stylesheet" href="/css/index.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>📖 漫画浏览器</h1>

      <div class="input-group">
        <input type="text" id="pathInput" placeholder="输入相对路径，例如: img/a 或 photos/2024" autocomplete="off">
        <button id="loadBtn">加载漫画</button>
      </div>

      <div id="status" class="status"></div>

      <div class="info-bar" id="infoBar" style="display: none;">
        <span>📁 路径: <strong id="pathDisplay"></strong></span>
        <span>📖 页数: <strong id="countDisplay">0</strong></span>
        <span style="margin-left: auto; color: #999; font-size: 12px;">💡 点击任意图片进入阅读模式</span>
      </div>
    </div>

    <div id="gallery" class="gallery">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p>输入一个文件夹路径来加载漫画</p>
        <div class="example">示例: img/a, photos/2024, album 等</div>
      </div>
    </div>
  </div>

  <script src="/js/index.js"></script>
</body>

</html>
